name: Update Debugger UI Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  upgrade:
    name: Upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: ui/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - run: npm ci --ignore-scripts
      - run: npm run upgrade
      - id: diff
        run: |
          if [ -n "$(git status --porcelain -- . ../public/vendor)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-upgrade
          path: |
            ui/package.json
            ui/package-lock.json
            public/vendor/
          if-no-files-found: error

  # Separate job: the upgraded packages ran in the one above, never next to the App token.
  pull-request:
    name: Open Pull Request
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm -rf public/vendor/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-upgrade
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/debugger-dependencies
          delete-branch: true
          sign-commits: true
          commit-message: "chore(debugger): update vendored dependencies"
          title: "chore(debugger): update vendored dependencies"
          body: Generated by `npm run upgrade` in `ui/`, which skips releases younger than a week.
