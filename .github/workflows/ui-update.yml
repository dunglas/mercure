name: Update Debugger UI Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  upgrade:
    name: Upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: ui/
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      - run: npm ci --ignore-scripts
      - run: npm run upgrade
      - id: diff
        run: |
          if [ -n "$(git status --porcelain -- . ../public/vendor)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-upgrade
          path: |
            ui/package.json
            ui/package-lock.json
            public/vendor/
          if-no-files-found: error

  # Separate job: the upgraded packages ran in the one above, never next to the App token.
  pull-request:
    name: Open Pull Request
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rm -rf public/vendor/
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ui-upgrade
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/debugger-dependencies
          delete-branch: true
          sign-commits: true
          commit-message: "chore(debugger): update vendored dependencies"
          title: "chore(debugger): update vendored dependencies"
          body: Generated by `npm run upgrade` in `ui/`, which skips releases younger than a week.
