version: 2
before:
  hooks:
    - go mod tidy
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  use: github-native
release:
  prerelease: auto
  draft: true
env:
  - CGO_ENABLED=0
builds:
  - id: caddy
    dir: caddy/mercure
    ldflags:
      - -X 'github.com/caddyserver/caddy/v2/modules/caddyhttp.ServerHeader=Mercure.rocks Caddy'
      - -X 'github.com/caddyserver/caddy/v2.CustomVersion=Mercure.rocks {{ .Version }} Caddy'
      - -X 'github.com/caddyserver/caddy/v2.CustomBinaryName=mercure'
    tags:
      - deprecated_transport
      - deprecated_topic
      - deprecated_claim
      - nobadger
      - nomysql
      - nopgx
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
archives:
  - ids:
      - caddy
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - COPYRIGHT
      - LICENSE
      - README.md
      - Caddyfile
    format_overrides:
      - goos: windows
        formats: [zip]
dockers_v2:
  - ids:
      - caddy
    images:
      - dunglas/mercure
    tags:
      # Rolling tags are suppressed on prereleases so a prerelease cut does
      # not move :latest/:vN off the stable line. Empty tags are dropped.
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - Caddyfile
nfpms:
  - id: linux_packages
    package_name: mercure
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}.{{ .Format }}"
    ids:
      - caddy
    formats:
      - apk
      - deb
      - rpm
    maintainer: "Kévin Dunglas <kevin@dunglas.dev>"
    description: "An open, easy, fast, reliable and battery-efficient solution for real-time communications."
    license: "AGPL-3.0-or-later"
    vendor: "Dunglas Services SAS"
    homepage: "https://mercure.rocks"
    bindir: /usr/bin
signs:
  - artifacts: checksum
    args:
      [
        "--batch",
        "-u",
        "{{ .Env.GPG_FINGERPRINT }}",
        "--output",
        "${signature}",
        "--detach-sign",
        "${artifact}",
      ]
